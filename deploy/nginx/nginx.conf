# 本地部署 Nginx 配置(Windows 请将 alias/root 路径改为实际目录)
# 功能: 托管 Web 管理后台与移动端 H5 静态资源, 反代后端 API 与上传文件
server {
    listen       80;
    server_name  _;

    client_max_body_size 20m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;

    # 后端 API(本地 Spring Boot)
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 上传文件
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 移动端 H5(admin-web/mobile 构建产物路径按实际修改)
    location /mobile/ {
        alias D:/worklog/mobile/dist/build/h5/;
        index index.html;
        try_files $uri $uri/ /mobile/index.html;
    }

    # Web 管理后台
    location / {
        root D:/worklog/admin-web/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
