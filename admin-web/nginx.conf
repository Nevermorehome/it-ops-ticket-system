# admin-web nginx 配置
# - 托管 Vite 构建产物(SPA history 路由)
# - /api /uploads 反代到 backend 容器(同一 docker network)
#   服务名 backend 由 docker-compose 服务定义, 解析到对应容器 IP

server {
    listen       80;
    server_name  _;

    # 静态文件根目录(Vite 默认 outDir=dist)
    root   /usr/share/nginx/html;
    index  index.html;

    # 大文件上传(图片/附件)
    client_max_body_size 100m;

    # SPA history 模式: 资源找不到回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存(hash 文件名, 长缓存)
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # API 反代到后端容器
    location /api/ {
        proxy_pass http://backend:9080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 长连接超时(导出 Excel 等慢接口)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 上传文件反代到后端容器
    location /uploads/ {
        proxy_pass http://backend:9080/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
